<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Demo 3 — PASS procedure</title>
    <link rel="stylesheet" href="../Shared/style.css" />
    <link rel="stylesheet" href="procedure.css" />
  </head>
  <body class="procedure">
    <section id="hud">
      <p class="eyebrow">03 · GUIDED PASS v2.2</p>
      <h1>PASS procedure</h1>
      <p id="status"></p>
      <div class="controls">
        <button id="enter-vr">Enter VR</button><button id="hint">Hint</button
        ><button id="reset">Reset</button>
      </div>
      <div id="step-controls" class="controls">
        <button id="safety" data-steps="0">Confirm safety</button>
        <button id="body" data-steps="1" class="secondary">
          Hold ABC · left hand
        </button>
        <button id="pressure" data-steps="2" class="secondary">
          Inspect pressure
        </button>
        <button id="pin" data-steps="3" class="secondary">Pull pin</button>
        <button id="nozzle" data-steps="4" class="secondary">
          Hold nozzle · right hand
        </button>
        <button id="aim-nozzle" data-steps="4" class="secondary">
          Aim at base
        </button>
        <button id="spray" data-steps="5,6" class="secondary">
          Spray [Space]
        </button>
        <button id="sweep" data-steps="6" class="secondary">
          Next section [J]
        </button>
        <button id="verify" data-steps="7" class="secondary">Finish</button>
      </div>
      <details>
        <summary>Controls</summary>
        <p>
          Quest: side GRIP holds, index trigger selects / sprays. Left X
          recenters.
        </p>
        <p>
          Mouse: drag (Shift = left hand), or use buttons. Space sprays; arrows
          / J sweep.
        </p>
      </details>
      <p id="metrics"></p>
      <a href="../">Portfolio</a>
    </section>
    <div id="notice" role="status"></div>
    <script type="module" src="main.js?v=pass-2.2"></script>
  </body>
</html>
